<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSAB OTP | دخول الأدمن</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="login"><main class="login-card"><div class="logo">MUSAB <b>OTP</b></div><p class="eyebrow">SECURE ADMIN ACCESS</p><h1>تسجيل دخول الأدمن</h1><p class="muted">لوحة خاصة بالإدارة — لا يوجد إنشاء حسابات عامة.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="notice {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>اسم المستخدم</label><input name="username" autocomplete="username" required placeholder="admin"><label>كلمة المرور</label><input type="password" name="password" autocomplete="current-password" required placeholder="••••••••"><button class="primary">دخول آمن <span>↗</span></button></form><small>استخدم بيانات الأدمن التي وضعتها في إعدادات الاستضافة.</small></main></body></html>
